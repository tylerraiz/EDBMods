@REFLECTION_CONFIG[default]:NEEDS[TexturesUnlimited]
{
	%enabled = true
}

KSP_MODEL_SHADER
{
	name = EDB-Ariane6BoosterCone
	model = EDBMods/Parts/Ariane6/Ariane6BoosterCone
	TEXTURE
    {
        shader = SSTU/PBR/Metallic
		
        PROPERTY
		{
			name = _Color
			color = 1.0,1.0,1.0   //higher numbers are lighter
		}
		PROPERTY
		{
			name = _Metal
			float = 0.4  // 0>less metallic 1>more metallic(mirror finish)
		}
		PROPERTY
			{
			name = _Smoothness
			float = 0.3   // 1>less blurry 0>more blurry
		}
	}
}

