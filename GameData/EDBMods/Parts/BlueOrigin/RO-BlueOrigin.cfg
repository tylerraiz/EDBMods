@PART[EDB-BOAscentOMS]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	@mass = 0.125
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/BlueOrigin/AscentOMS
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 33.4
		@maxThrust = 33.4
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = MMH
			@ratio = 0.4943
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = MON3
			@ratio = 0.5057
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 316
			@key,1 = 1 100
		}
		%ullage = False
		%pressureFed = True
		%ignitions = 500
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = BO-AscentOMS
		CONFIG
		{
			name = BO-AscentOMS
			minThrust = 33.4
			maxThrust = 33.4
			heatProduction = 160
			PROPELLANT
			{
				name = MMH
				ratio = 0.4943
				DrawGauge = True
			}
			PROPELLANT
			{
				name = MON3
				ratio = 0.5057
			}
			atmosphereCurve
			{
				key = 0 316
				key = 1 100
			}
		}
	}

}

@PART[EDB-BOAscentOMS]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    PLUME
    {
        name = Hypergolic-Upper
        transformName = thrustTransform
        plumePosition = 0.0, 0.0, 0.0
        plumeScale = 2.0
        flarePosition = 0.0, 0.0, 0.0
        flareScale = 2.0
        smokePosition = 0.0, 0.0, 0.0
        smokeScale = 1.0
        localRotation = 0.0, 0.0, 0.0
        emissionMult = 1.0
        energy = 1.0
        speed = 1.0
    }

    @MODULE[ModuleEngines*]
    {
        %powerEffectName = Hypergolic-Upper
        !runningEffectName = NULL
    }

    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG,*
        {
            %powerEffectName = Hypergolic-Upper
        }
    }
}

@PART[EDB-CislunarTransporter]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/BlueOrigin/CislunarTransporter
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 13.0
	
	!RESOURCE[LiquidFuel]
	{
	}
	!RESOURCE[Oxidizer]
	{
	}
	!RESOURCE[MonoPropellant]
	{
	}
	!RESOURCE[ElectricCharge]
	{
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 625000
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 5000
			maxAmount = 5000
		}
		TANK
		{
			name = LqdHydrogen
			amount = 351026.0
			maxAmount = 351026.0
		}
		TANK
		{
			name = LqdOxygen
			amount = 108974.0
			maxAmount = 108974.0
		}
		TANK
		{
			name = Hydrogen
			amount = 0.0
			maxAmount = 262615.0
		}
		TANK
		{
			name = Oxygen
			amount = 0.0
			maxAmount = 89699.0
		}
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.22

		PROPELLANT
		{
			name = LqdHydrogen
			ratio = 0.7631
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.2369
		}
		atmosphereCurve
		{
			key = 0 400
			key = 1 82
		}
	}
	
	
	!MODULE[ModuleResourceConverter]{}
	
	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #autoLOC_502022 //#autoLOC_502022 = Fuel Cell
		 StartActionName = #autoLOC_502023 //#autoLOC_502023 = Start Fuel Cell
		 StopActionName = #autoLOC_502024 //#autoLOC_502024 = Stop Fuel Cell
		 ToggleActionName = #autoLOC_502025 //#autoLOC_502025 = Toggle Fuel Cell
		 FillAmount = 0.95
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
 
		 
		 INPUT_RESOURCE
		 {
			ResourceName = LqdHydrogen
			Ratio = 0.000253
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 0.000121
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 OUTPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 1.5
			DumpExcess = false
		 }
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = HydroGas Producer
		 StartActionName = Start HydroGas Production
		 StopActionName = Stop HydroGas Production
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		
		INPUT_RESOURCE
		 {
			ResourceName = LqdHydrogen
			Ratio = 20.0
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 0.01
		 }
		 OUTPUT_RESOURCE
		{
			ResourceName = Hydrogen
			Ratio = 2000.0
			DumpExcess = false
		}	
		
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Hydrogen Cooler
		 StartActionName = Start Hydrogen Cooling
		 StopActionName = Stop Hydrogen Cooling
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		
		INPUT_RESOURCE
		 {
			ResourceName = Hydrogen
			Ratio = 200.0
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 0.2
		 }
		 OUTPUT_RESOURCE
		{
			ResourceName = LqdHydrogen
			Ratio = 2.0
			DumpExcess = false
		}	
		
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = OxyGas Producer
		 StartActionName = Start Oxygen Production
		 StopActionName = Stop Oxygen Production
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		
		INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 20.0
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 0.01
		 }
		 OUTPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 2000.0
			DumpExcess = false
		}	
		
	}
	
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Oxygen Cooler
		 StartActionName = Start Oxygen Cooling
		 StopActionName = Stop Oxygen Cooling
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
		
		INPUT_RESOURCE
		 {
			ResourceName = Oxygen
			Ratio = 200.0
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 0.2
		 }
		 OUTPUT_RESOURCE
		{
			ResourceName = LqdOxygen
			Ratio = 2.0
			DumpExcess = false
		}	
		
	}
	
	
}