	crashTolerance = 16
	maxTemp = 2000 
	tags = spacecraft pod 
	vesselType = Ship
	
	MODULE
	{
		name = ModuleDecouple
		ejectionForce = 20
		explosiveNodeID = top
	}
	
	MODULE
	{
		name = ModuleCommand
		minimumCrew = 0
