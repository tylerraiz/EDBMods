PART
{
	name = EDB-CST-100-SM
	module = Part
	author = tylerraiz
	MODEL
	{
		model = EDBMods/Parts/CST-100/CST-100-SM
		scale = 0.64,0.64,0.64
	}
	scale = 0.64
	rescaleFactor = 1.0
	
	node_stack_top = 0.0, 0.55, 0.0, 0.0, 1.0, 0.0, 2
	node_stack_abort = 0.0, -0.9, 0.0, 0.0, -1.0, 0.0, 2
	node_stack_bottom = 0.0, -1.353, 0.0, 0.0, -1.0, 0.0, 2
	
	TechRequired = basicRocketry
	entryCost = 3500
	cost = 1200
