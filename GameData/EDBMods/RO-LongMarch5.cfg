@PART[EDB-YF-75D]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/LongMarch5/YF-75D
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 0.25 //estimate
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 98.05
		@maxThrust = 98.05
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 0.733
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.267
		}
		@atmosphereCurve
		{
			@key,0 = 0 442.0
			@key,1 = 1 50
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 5
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.5
		}

	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = YF-75D
		CONFIG
		{
			name = YF-75D
			minThrust = 98.05
			maxThrust = 98.05
			heatProduction = 160
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.733
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.267
			}
			atmosphereCurve
			{
				key = 0 440.9
				key = 1 50.0
			}
		}
	}

	
	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 3.0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}
	
}

@PART[EDB-YF-75D]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Hydrolox-Upper
		!fxOffset = DELETE

	}
	
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Hydrolox-Upper
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0.75
        fixedScale = 1
        energy = 1
        speed = 2
    }
}

