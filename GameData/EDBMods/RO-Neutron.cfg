@PART[EDB-NeutronCore]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Neutron/NeutronCore
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 12.6
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 301010.0
		type = ServiceModule
		basemass = -1
		
		TANK
		{
			name = ElectricCharge
			amount = 10000.0
			maxAmount = 10000.0
		}
		TANK
		{
			name = Kerosene
			amount = 108026.6
			maxAmount = 108026.6
		}
		TANK
		{
			name = LqdOxygen
			amount = 192883.1
			maxAmount = 192883.1
		}
	}
	
}

@PART[EDB-NeutronN]:FOR[RealismOverhaul]
