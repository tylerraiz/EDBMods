@PART[EDB-Archimedes]:FOR[RealismOverhaul]
{

	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Neutron/Archimedes
		scale = 1.2,1.2,1.2
	}
	
	@scale = 1.2
	
	@mass = 0.9
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 398.75
		@maxThrust = 797.5
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdMethane
			@ratio = 0.4417
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.5583
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 329.0
			@key,1 = 1 302.0
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 10
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	!MODULE[ModuleEngineConfigs]{}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = Archimedes
		CONFIG
		{
			name = Archimedes
			minThrust = 398.75
			maxThrust = 797.5
			heatProduction = 160
			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4417
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5583
			}
			atmosphereCurve
			{
				key = 0 329.0
				key = 1 302.0
			}
		}
	}

}

@PART[EDB-Archimedes]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Methalox_Lower
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Methalox_Lower
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0
        fixedScale = 1
        energy = 1
        speed = 1
    }
}

