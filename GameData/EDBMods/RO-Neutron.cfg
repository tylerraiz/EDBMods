	@mass = 18.5
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 481110
		type = ServiceModule
		basemass = -1
		
		TANK
		{
			name = ElectricCharge
			amount = 10000.0
			maxAmount = 10000.0
		}
		TANK
		{
			name = LqdMethane
			amount = 180626.6
			maxAmount = 180626.6
		}
		TANK
		{
			name = LqdOxygen
			amount = 228393.4
			maxAmount = 228393.4
		}
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 1.04

		PROPELLANT
		{
			name = LqdMethane
			ratio = 0.4417
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.5583
		}
		atmosphereCurve
		{
			key = 0 343.6
			key = 1 1.0
		}
	}
	
	
}

