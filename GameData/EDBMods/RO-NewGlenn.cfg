@PART[EDB-BE3U]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	@mass = 0.63
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/NewGlenn/BE-3U
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 530.0
		@maxThrust = 710.0
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 0.7631
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.2369
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 446.0
			@key,1 = 1 100
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 5
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = BE-3U
		CONFIG
		{
			name = BE-3U
			minThrust = 530.0
			maxThrust = 710.0
			heatProduction = 160
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}
			atmosphereCurve
			{
				key = 0 446.0
				key = 1 100
			}
		}
	}

}

@PART[EDB-BE3U]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Hydrolox-Upper
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Hydrolox-Upper
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0.0
        fixedScale = 1
        energy = 1
        speed = 2
    }
}

