+PART[EDB-RaptorSL]:NEEDS[RealismOverhaul]
{
	@name = EDB-RaptorHydSL
	@title = Hydrogen-burning Raptor
	%RSSROConfig = True
	
	@mass = 2.0
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Starship/RaptorSL
		scale = 0.9,0.9,0.9
	}
	@scale = 0.9
	@rescaleFactor = 1.0
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 399.5
		@maxThrust = 1596.2
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
			@ratio = 0.7631
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.2369
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 415.8
			@key,1 = 1 399.2
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 5
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = RaptorHydroSL
		CONFIG
		{
			name = RaptorHydroSL
			minThrust = 399.5
			maxThrust = 1596.2
			heatProduction = 160
			
			%throttleResponseRate = 1.0 //should be around 30 secs too fully ramp up to 100% from 0%.
			%throttleStartedMult = 2.0
			%throttleStartupMult = 2.0
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7631
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2369
			}
			atmosphereCurve
			{
				key = 0 415.8
				key = 1 399.2
			}
		}
	}

}

