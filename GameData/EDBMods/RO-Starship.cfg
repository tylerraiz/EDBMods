@PART[EDB-StarshipBody]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Starship/StarshipBody
		scale = 1,1,1
	}
	@scale = 1.0
	
	@mass = 90.0
	
	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0, -5.0, 0
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 1420000
		type = Cryogenic
		
		TANK
		{
			name = LqdMethane
			amount = 587454.0
			maxAmount = 587454.0
		}
		TANK
		{
			name = LqdOxygen
			amount = 832546.0
			maxAmount = 832546.0
		}
	}
	
	
	!MODULE[ModuleRCSFX]{}
	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 2.4

		PROPELLANT
		{
			name = LqdMethane
			ratio = 0.4137
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.5863
		}
		atmosphereCurve
		{
			key = 0 330
			key = 1 240
		}
	}
	
	!MODULE[ModuleResourceConverter]{}
	
	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #autoLOC_502022 //#autoLOC_502022 = Fuel Cell
		 StartActionName = #autoLOC_502023 //#autoLOC_502023 = Start Fuel Cell
		 StopActionName = #autoLOC_502024 //#autoLOC_502024 = Stop Fuel Cell
		 ToggleActionName = #autoLOC_502025 //#autoLOC_502025 = Toggle Fuel Cell
		 FillAmount = 0.95
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
 
		 
		 INPUT_RESOURCE
		 {
			ResourceName = LqdMethane
			Ratio = 0.00155
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 0.00220
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 OUTPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 12.0
			DumpExcess = false
		 }
	}
	
}

