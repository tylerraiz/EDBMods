@PART[EDB-BE4]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	@mass = 2.25
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Vulcan/BE-4
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 794.25
		@maxThrust = 2647.5
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdMethane
			@ratio = 0.4286
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.5714
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 341
			@key,1 = 1 305
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 10
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = BE-4
		CONFIG
		{
			name = BE-4
			minThrust = 794.25
			maxThrust = 2647.5
			heatProduction = 160
			PROPELLANT
			{
				name = LqdMethane
				ratio = 0.4286
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.5714
			}
			atmosphereCurve
			{
				key = 0 341
				key = 1 305
			}
		}
	}
	
	@MODULE[ModuleGimbal]
	{
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

}

@PART[EDB-BE4]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    PLUME
    {
        name = Methalox_LowerShock
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0.0
        fixedScale = 1
        energy = 1
        speed = 1
        emissionMult = 1.0
        alphaMult = 1

        flarePosition = 0,0,0.0
        flareScale = 1.0

        plumePosition = 0,0,0.3
        plumeScale = 2.4

        fumePosition = 0,0,0.7
        fumeScale = 2.6

        blazePosition = 0,0,5
        blazeScale = 2.4
    }

    @MODULE[ModuleEngines*]
    {
        %powerEffectName = Methalox_LowerShock
        !runningEffectName = DELETE
    }

    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG,*
        {
            %powerEffectName = Methalox_LowerShock
        }
    }
}

@PART[EDB-CentaurX]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Vulcan/CentaurX
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 5.535
	
	!RESOURCE[LiquidFuel]
	{
	}
	!RESOURCE[Oxidizer]
	{
	}
	!RESOURCE[MonoPropellant]
	{
	}
	!RESOURCE[ElectricCharge]
	{
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 158163.2
		type = ServiceModule
		basemass = -1
		TANK
		{
			name = ElectricCharge
			amount = 50000
			maxAmount = 50000
		}
		TANK
		{
			name = LqdHydrogen
			amount = 117894.85
			maxAmount = 117894.85
		}
		TANK
		{
			name = LqdOxygen
			amount = 40268.35
			maxAmount = 40268.35
		}
	}
	@MODULE[ModuleRCS*]
	{
		@name = ModuleRCSFX
		@thrusterPower = 0.2
		!resourceName = MonoPropellant
		@resourceFlowMode = STAGE_PRIORITY_FLOW
		%PROPELLANT
		{
			%name = LqdHydrogen
			%ratio = 0.7454
		}
		%PROPELLANT
		{
			%name = LqdOxygen
			%ratio = 0.2546
		}
		@atmosphereCurve
		{
			@key,0 = 0 400
			@key,1 = 1 50
		}
	}
	
	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #autoLOC_502022 //#autoLOC_502022 = Fuel Cell
		 StartActionName = #autoLOC_502023 //#autoLOC_502023 = Start Fuel Cell
		 StopActionName = #autoLOC_502024 //#autoLOC_502024 = Stop Fuel Cell
		 ToggleActionName = #autoLOC_502025 //#autoLOC_502025 = Toggle Fuel Cell
		 FillAmount = 0.95
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
 
		 
		 INPUT_RESOURCE
		 {
			ResourceName = LqdHydrogen
			Ratio = 0.000253
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 0.0000866
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 OUTPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 1.5
			DumpExcess = false
		 }
	}
	
	
}

