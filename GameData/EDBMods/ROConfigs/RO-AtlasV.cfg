@PART[EDB-AtlasVRD180]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/AtlasV/RD-180
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 5.48
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 1951.44
		@maxThrust = 4152
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
			@ratio = 0.338
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.662
		}
		@atmosphereCurve
		{
			@key,0 = 0 338.4
			@key,1 = 1 311.9
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 1
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.5
		}
		IGNITOR_RESOURCE
		{
			name = TEATEB
			amount = 1.0
		}
	}
	
	RESOURCE
	{
		name = TEATEB
		amount = 1
		maxAmount = 1
	}
	
	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 8
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = RD-180-EDB
		CONFIG
		{
			name = RD-180-EDB
			minThrust = 1951.44
			maxThrust = 4152
			heatProduction = 160
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.338
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.662
			}
			atmosphereCurve
			{
				key = 0 338.4
				key = 1 311.9
			}
		}
	}

	
}

