@PART[EDB-BOAscentOMS]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	@mass = 0.125
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/BlueOrigin/AscentOMS
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 33.4
		@maxThrust = 33.4
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = MMH
			@ratio = 0.4943
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = MON3
			@ratio = 0.5057
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 316
			@key,1 = 1 100
		}
		%ullage = False
		%pressureFed = True
		%ignitions = 500
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = BO-AscentOMS
		CONFIG
		{
			name = BO-AscentOMS
			minThrust = 33.4
			maxThrust = 33.4
			heatProduction = 160
			PROPELLANT
			{
				name = MMH
				ratio = 0.4943
				DrawGauge = True
			}
			PROPELLANT
			{
				name = MON3
				ratio = 0.5057
			}
			atmosphereCurve
			{
				key = 0 316
				key = 1 100
			}
		}
	}

}

@PART[EDB-BOAscentOMS]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    PLUME
    {
        name = Hypergolic-Upper
        transformName = thrustTransform
        plumePosition = 0.0, 0.0, 0.0
        plumeScale = 2.0
        flarePosition = 0.0, 0.0, 0.0
        flareScale = 2.0
        smokePosition = 0.0, 0.0, 0.0
        smokeScale = 1.0
        localRotation = 0.0, 0.0, 0.0
        emissionMult = 1.0
        energy = 1.0
        speed = 1.0
    }

    @MODULE[ModuleEngines*]
    {
        %powerEffectName = Hypergolic-Upper
        !runningEffectName = NULL
    }

    @MODULE[ModuleEngineConfigs]
    {
        @CONFIG,*
        {
            %powerEffectName = Hypergolic-Upper
        }
    }
}