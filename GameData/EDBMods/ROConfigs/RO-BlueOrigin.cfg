@PART[EDB-BlueOriginAscentStage]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/BlueOrigin/AscentStage
		scale = 1, 1, 1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	@mass = 0.911
	
	
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 6100
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 100000.0
			maxAmount = 100000.0
		}
		TANK
		{
			name = MMH
			amount = 2965.8
			maxAmount = 2965.8
		}
		TANK
		{
			name = MON3
			amount = 3034.2
			maxAmount = 3034.2
		}
	}
	
	!MODULE[ModuleRCSFX]{}
	
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.2

		PROPELLANT
		{
			name = MMH
			ratio = 0.4943
			DrawGauge = True
		}
		PROPELLANT
		{
			name = MON3
			ratio = 0.5057
		}
		atmosphereCurve
		{
			key = 0 316
			key = 1 80
		}
	}
	
}

