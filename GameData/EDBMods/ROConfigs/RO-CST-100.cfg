@PART[EDB-CST-100-Abort]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/CST-100/CST-100-Abort
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 711.72
		@maxThrust = 711.72
		@PROPELLANT[LiquidFuel]
		{
			@name = MMH
			@ratio = 0.50
		}
		@PROPELLANT[Oxidizer]
		{
			@name = NTO
			@ratio = 0.5
		}
		@atmosphereCurve
		{
			@key,0 = 0 311
			@key,1 = 1 260
		}
		%ullage = False
		%pressureFed = True
		%ignitions = -1
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 0.005
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = RS-88
		CONFIG
		{
			name = RS-88
			minThrust = 711.72
			maxThrust = 711.72
			heatProduction = 160
			
			%throttleResponseRate = 1.0 
			%throttleStartedMult = 2.0
			%throttleStartupMult = 2.0
			PROPELLANT
			{
				name = MMH
				ratio = 0.5
				DrawGauge = True
			}
			PROPELLANT
			{
				name = NTO
				ratio = 0.5
			}
			atmosphereCurve
			{
				key = 0 311
				key = 1 260
			}
		}
	}
	
}

@PART[EDB-CST-100-Abort]:FOR[RealPlume]:FOR[SmokeScreen,RealFuels]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Hypergolic-OMS-Red
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Hypergolic-OMS-Red
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0.0
        fixedScale = 1
        energy = 1
        speed = 2
    }
}


@PART[EDB-CST-100-HS]:FOR[RealismOverhaul_HeatShield]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/CST-100/CST-100-HS
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 0.3
	// Thermo
	@maxTemp = 2400
	%skinMaxTemp = 3600
	!MODULE[ModuleAblator] {}
	!MODULE[ModuleHeatShield] {}
	!MODULE[ModuleAeroReentry] {}
	!RESOURCE[AblativeShielding] {}
	!RESOURCE[Ablator] {}
	!RESOURCE[CharredAblator] {}
	%emissiveConstant = 0.6 // not too absorptive for reentry
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4
	
	%maxTemp = 2000
	%skinMaxTemp = 3400
	%heatShieldDensity = 0.0125
	%heatShieldAblator = 35
	%skinThermalMassModifier = 1.5
	%skinMassPerArea = 5.0
	%skinInternalConductionMult = 0.25
	%emissiveConstant = 0.4

	%MODULE[ModuleAblator]
	{
		%ablativeResource = Ablator
		%outputResource = CharredAblator
		%outputMult = 0.9
		%lossExp = -25000
		%lossConst = 350
		%pyrolysisLossFactor = 60000
		%ablationTempThresh = 1250
		%reentryConductivity = 0.0025
		%infoTemp = 3000
	}
	
	RESOURCE
	{
		name = Ablator
		amount = 800
		maxAmount = 800
	}
	RESOURCE
	{
		name = CharredAblator
		amount = 0
		maxAmount = 600
	}

}


@PART[EDB-CST-100-Pod]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/CST-100/CST-100-Pod
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	!MODULE[ModuleReactionWheel]{}
	
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = AdjustableCoMShifter
		DescentModeCoM = 0.0, 0.0, -0.2
	}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 1350
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 36000.0
			maxAmount = 36000.0
		}
		TANK
		{
			name = Food
			amount = 330.0
			maxAmount = 330.0
		}
		TANK
		{
			name = Water
			amount = 220.0
			maxAmount = 220.0
		}
		TANK
		{
			name = Oxygen
			amount = 33332.0
			maxAmount = 33332.0
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 28780.0
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 30.0
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 116.2
		}
		TANK
		{
			name = MMH
			amount = 100.0
			maxAmount = 100.0
		}
		TANK
		{
			name = NTO
			amount = 100.0
			maxAmount = 100.0
		}
		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.444

		PROPELLANT
		{
			name = MMH
			ratio = 0.5
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5
		}
		atmosphereCurve
		{
			key = 0 300.0
			key = 1 1.0
		}
	}
	
}


