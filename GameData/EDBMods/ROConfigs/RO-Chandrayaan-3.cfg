@PART[EDB-Chandrayaan-3Body]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Chandrayaan-3/Chandrayaan-3Body
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 730
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 10000.0
			maxAmount = 10000.0
		}
		TANK
		{
			name = MMH
			amount = 346.375
			maxAmount = 346.375
		}
		TANK
		{
			name = NTO
			amount = 371.875
			maxAmount = 371.875
		}

		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.05

		PROPELLANT
		{
			name = MMH
			ratio = 0.4822
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5178
		}
		atmosphereCurve
		{
			key = 0 310
			key = 1 82.0
		}
	}
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 1.44
		@maxThrust = 3.2
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = MMH
			@ratio = 0.4822
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = NTO
			@ratio = 0.5178
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 310
			@key,1 = 1 82
		}
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	
}


