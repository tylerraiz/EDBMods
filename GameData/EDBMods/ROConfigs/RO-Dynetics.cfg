@PART[EDB-DyneticsLunarLander]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Dynetics/DyneticsLanderBase
		scale = 1.25,1.25,1.25
	}
	@scale = 1.25
	@rescaleFactor = 1.0
	
	@mass = 1.48
	
	
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 11300
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 100000.0
			maxAmount = 100000.0
		}
		TANK
		{
			name = LqdMethane
			amount = 4633.4
			maxAmount = 4633.4
		}
		TANK
		{
			name = LqdOxygen
			amount = 6566.6
			maxAmount = 6566.6
		}
	}
	
	!MODULE[ModuleRCSFX]{}
	
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.4

		PROPELLANT
		{
			name = LqdMethane
			ratio = 0.4137
			DrawGauge = True
		}
		PROPELLANT
		{
			name = LqdOxygen
			ratio = 0.5863
		}
		atmosphereCurve
		{
			key = 0 330
			key = 1 80
		}
	}
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 16.0
		@maxThrust = 64.0
		@heatProduction = 160
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdMethane
			@ratio = 0.4137
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.5863
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 360
			@key,1 = 1 100
		}
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	!MODULE[ModuleResourceConverter]{}
	
	MODULE
	{
		 name = ModuleResourceConverter
		 ConverterName = #autoLOC_502022 //#autoLOC_502022 = Fuel Cell
		 StartActionName = #autoLOC_502023 //#autoLOC_502023 = Start Fuel Cell
		 StopActionName = #autoLOC_502024 //#autoLOC_502024 = Stop Fuel Cell
		 ToggleActionName = #autoLOC_502025 //#autoLOC_502025 = Toggle Fuel Cell
		 FillAmount = 0.95
		AutoShutdown = false
		GeneratesHeat = false
		UseSpecialistBonus = false
 
		 
		 INPUT_RESOURCE
		 {
			ResourceName = LqdMethane
			Ratio = 0.00155
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 INPUT_RESOURCE
		 {
			ResourceName = LqdOxygen
			Ratio = 0.00220
			FlowMode = STAGE_PRIORITY_FLOW
		 }
		 OUTPUT_RESOURCE
		 {
			ResourceName = ElectricCharge
			Ratio = 12.0
			DumpExcess = false
		 }
	}
	
}

