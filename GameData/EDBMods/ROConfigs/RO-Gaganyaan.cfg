@PART[EDB-GYHeatshield]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Gaganyaan/GYHeatshield
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@mass = 0.2
	// Thermo
	!!MODULE[ModuleAeroReentry] {}
	!RESOURCE[AblativeShielding] {}
	!RESOURCE[Ablator] {}
	!RESOURCE[CharredAblator] {}
	!DRAG_CUBE {}	// Let them generate normally.

	@category = Thermal
	%emissiveConstant = 0.6
	%skinMassPerArea = 4
	%thermalMassModifier = 1.0
	
	%maxTemp = 2400
	%skinMaxTemp = 3600
	%heatShieldDensity = 0.0125
	%heatShieldAblator = 30
	%skinThermalMassModifier = 1.5
	%skinMassPerArea = 5.0
	%skinInternalConductionMult = 0.25
	%emissiveConstant = 0.4

	%MODULE[ModuleAblator]
	{
		%ablativeResource = Ablator
		%outputResource = CharredAblator
		%outputMult = 0.8
		%lossExp = -25000
		%lossConst = 150
		%pyrolysisLossFactor = 145833
		%ablationTempThresh = 1250
		%reentryConductivity = 0.0025
		%infoTemp = 3000
	}
	RESOURCE
	{
		name = Ablator
		amount = 400
		maxAmount = 400
	}
	RESOURCE
	{
		name = CharredAblator
		amount = 0
		maxAmount = 300
	}
	
}

@PART[EDB-GYLES]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Gaganyaan/GYLES
		scale = 1,1,1
	}
	
	@scale = 1.0
	
	@MODULE[ModuleEngines*]
	{
		%EngineType = SolidBooster
		%allowShutdown = False
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = GYLES
