@PART[EDB-GYLES]:FOR[RealPlume]:NEEDS[SmokeScreen]	
{
    PLUME
    {
        name = Solid-Lower
        transformName = thrustTransform
        localRotation = 0,0,0
        flarePosition = 0,0,0
        plumePosition = 0,0,0
        fixedScale = 2
        energy = 1
        speed = 1
    }
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
        @CONFIG,*
		{
			%powerEffectName = Solid-Lower
		}
	}
}

