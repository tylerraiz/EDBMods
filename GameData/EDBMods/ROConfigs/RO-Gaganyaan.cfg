			name = GYLES
			minThrust = 500
			maxThrust = 500
			heatProduction = 100
			PROPELLANT
			{
				name = SolidFuel
				ratio = 1
				DrawGauge = True
			}
			atmosphereCurve
			{
				key = 0 230
				key = 1 220
			}
		}
	}
	
}

