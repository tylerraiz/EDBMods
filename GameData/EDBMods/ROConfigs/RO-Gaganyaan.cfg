@PART[EDB-GYCapsule]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Gaganyaan/GYCapsule
		scale = 1,1,1
	}
	
	@scale = 1.0
	@mass = 2.935
	
	%emissiveConstant = 0.9 
	@maxTemp = 1600
	%skinMaxTemp = 3200
	
	!MODULE[ModuleReactionWheel]{}
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 1350
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 36000.0
			maxAmount = 36000.0
		}
		TANK
		{
			name = MMH
			amount = 86.6
			maxAmount = 86.6
		}
		TANK
		{
			name = NTO
			amount = 92.9
			maxAmount = 92.9
		}
		TANK
		{
			name = Food
			amount = 165.0
			maxAmount = 165.0
		}
		TANK
		{
			name = Water
			amount = 110.0
			maxAmount = 110.0
		}
		TANK
		{
			name = Oxygen
			amount = 16660.0
			maxAmount = 16660.0
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 14390.0
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 15.0
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 58.1
		}
		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.1

		PROPELLANT
		{
			name = MMH
			ratio = 0.4822
			DrawGauge = True
		}
		PROPELLANT
		{
			name = NTO
			ratio = 0.5178
		}
		atmosphereCurve
		{
			key = 0 295
			key = 1 82.0
		}
	}
	
}

