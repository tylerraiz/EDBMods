@PART[EDB-KRE-075x4]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	@mass = 3.96
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/KSLV/KRE-075x4
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 2904.4
		@maxThrust = 2904.4
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
			@ratio = 0.373
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = LqdOxygen
			@ratio = 0.627
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 298.3
			@key,1 = 1 261.6
		}
		%ullage = True
		%pressureFed = False
		%ignitions = 1
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = KRE-075x4
		CONFIG
		{
			name = KRE-075x4
			minThrust = 2904.4
			maxThrust = 2904.4
			heatProduction = 160
			PROPELLANT
			{
				name = Kerosene
				ratio = 0.373
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.627
			}
			atmosphereCurve
			{
				key = 0 298.3
				key = 1 261.6
			}
		}
	}
	
	@MODULE[ModuleGimbal]
	{
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

}

@PART[EDB-KRE-075x4]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Kerolox_LowerNK33
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Kerolox_LowerNK33
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,5.0
        fixedScale = 1
        energy = 1
        speed = 2
    }
}

