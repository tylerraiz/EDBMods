@PART[EDB-Leasat]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Leasat/Leasat
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 1200
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 10000.0
			maxAmount = 10000.0
		}
		TANK
		{
			name = Hydrazine
			amount = 1190.0
			maxAmount = 1190.0
		}
		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.104

		PROPELLANT
		{
			name = Hydrazine
			ratio = 1.0
			DrawGauge = True
		}
		atmosphereCurve
		{
			key = 0 280.0
			key = 1 1.0
		}
	}

}