@PART[EDB-HALOBody]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	@title = Lunar Gateway HALO Module (Standard)
	
	!MODEL {}
	MODEL
	{
		model = EDBMods/Parts/LunarGateway/HALOBody
		scale = 0.8,0.8,0.8
	}
	@scale = 0.8

	@mass = 6.1
	
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 2700
		basemass = -1
		type = ServiceModule
		TANK
		{
			name = ElectricCharge
			amount = 43200
			maxAmount = 43200
		}
		TANK
		{
			name = Food
			amount = 23.4
			maxAmount = 702
		}
		TANK
		{
			name = Water
			amount = 15.47
			maxAmount = 464
		}
		TANK
		{
			name = Oxygen
			amount = 2368.8
			maxAmount = 71063.83
		}
		TANK
		{
			name = CarbonDioxide
			amount = 0
			maxAmount = 61383.91
		}
		TANK
		{
			name = Waste
			amount = 0
			maxAmount = 63.84
		}
		TANK
		{
			name = WasteWater
			amount = 0
			maxAmount = 590.88
		}
		TANK
		{
			name = LithiumHydroxide
			amount = 3
			maxAmount = 90
		}
	}

	MODULE:NEEDS[TacLifeSupport]
	{
		name = TacGenericConverter
		converterName = CO2 Scrubber
		StartActionName = Start CO2 Scrubber
		StopActionName = Stop CO2 Scrubber
		tag = Life Support
		GeneratesHeat = False
		UseSpecialistBonus = True
		SpecialistEfficiencyFactor = 0.2
		SpecialistBonusBase = 0.05
		ExperienceEffect = ConverterSkill
		EfficiencyBonus = 1
		conversionRate = 4.0	// # of people - Figures based on per/person

		INPUT_RESOURCE
		{
			ResourceName = CarbonDioxide
			Ratio = 0.00589121
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 0.01
		}

		INPUT_RESOURCE
		{
			ResourceName = LithiumHydroxide
			Ratio = 0.0000085683
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.0032924498
			DumpExcess = True
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Waste
			Ratio = 0.0000257297
			DumpExcess = False
		}
	}
}

