@PART[EDB-PPEBody]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	
	@title = Lunar Gateway PPE Module (Standard)
	
	!MODEL {}
	MODEL
	{
		model = EDBMods/Parts/LunarGateway/PPEBody
		scale = 0.8,0.8,0.8
	}
	@scale = 0.8

	@mass = 0.4267
	
	!MODULE[ModuleReactionWheel]{}
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[XenonGas]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		volume = 18771.5
		basemass = -1
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 43200
			maxAmount = 43200
		}
		TANK
		{
			name = Hydrazine
			amount = 1000.0
			maxAmount = 1000.0
		}
		TANK
		{
			name = XenonGas
			amount = 850000.0
			maxAmount = 850000.0
		}
		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.44

		PROPELLANT
		{
			name = Hydrazine
			ratio = 1.0
			DrawGauge = True
		}
		atmosphereCurve
		{
			key = 0 240
			key = 1 82.08
		}
	}
	
	
}

