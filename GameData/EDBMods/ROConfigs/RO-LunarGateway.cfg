@PART[EDB-PPEIon]:FOR[RealismOverhaul]
{

	%RSSROConfig = True
	
	!MODEL {}
	MODEL
	{
		model = EDBMods/Parts/LunarGateway/PPEIon
		scale = 0.85,0.85,0.85
	}
	@scale = 0.85

	@mass = 0.123

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		@minThrust = 0.000386
		@maxThrust = 0.000589
		@heatProduction = 0

		!PROPELLANT[ElectricCharge]{}

		@PROPELLANT[XenonGas]
		{
			@ratio = 1.0
		}

		@atmosphereCurve
		{
			@key,0 = 0 2600
			@key,1 = 1 1
		}
	}

	!MODULE[ElectricEngineThrustLimiter]{}

	MODULE
	{
		name = ModuleAlternator
		RESOURCE
		{
			name = ElectricCharge
			rate = -12.5
		}
	}
}

@PART[EDB-PPEIon]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
	
	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		!runningEffectName = DELETE
		%powerEffectName = Ion-Xenon-Hall
	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Ion-Xenon-Hall
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0
        fixedScale = 1
        energy = 1
        speed = 1
    }
}