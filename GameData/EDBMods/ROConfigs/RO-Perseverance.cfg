@PART[EDB-PerseveranceHeatshield]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Perseverance/Heatshield
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	@mass = 0.25
	// Thermo
	@maxTemp = 2400
	%skinMaxTemp = 3600
	!MODULE[ModuleAblator] {}
	!MODULE[ModuleHeatShield] {}
	!MODULE[ModuleAeroReentry] {}
	!RESOURCE[AblativeShielding] {}
	!RESOURCE[Ablator] {}
	!RESOURCE[CharredAblator] {}
	%emissiveConstant = 0.6 // not too absorptive for reentry
	%thermalMassModifier = 1.0
	%skinMassPerArea = 4
	MODULE
	{
		name = ModuleAblator
		ablativeResource = Ablator
		outputResource = CharredAblator
		outputMult = 0.75
		lossExp = -40000
		lossConst = 15000
		pyrolysisLossFactor = 40000
		ablationTempThresh = 500
		reentryConductivity = 0.01
		//reentryConductivity = 0.12
		//@reentryConductivity = #$../heatConductivity$ // if it exists, use it
	}
	@MODULE[ModuleAblator]:NEEDS[DeadlyReentry]
	{
		@name = ModuleHeatShield
		depletedMaxTemp = 1200
	}
	RESOURCE
	{
		name = Ablator
		amount = 800
		maxAmount = 800
	}
	RESOURCE
	{
		name = CharredAblator
		amount = 0
		maxAmount = 600
	}
	
}

@PART[EDB-PerseveranceSkycrane]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True
	
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Perseverance/Skycrane
		scale = 1,1,1
	}
	@scale = 1.0
	@rescaleFactor = 1.0
	
	@maxTemp = 1800
	%skinMaxTemp = 2500
	
	!RESOURCE[LiquidFuel]{}
	!RESOURCE[Oxidizer]{}
	!RESOURCE[ElectricCharge]{}
	!RESOURCE[MonoPropellant]{}
	
	MODULE
	{
		name = ModuleFuelTanks
		basemass = -1
		volume = 496
		type = ServiceModule
		
		TANK
		{
			name = ElectricCharge
			amount = 96000.0
			maxAmount = 96000.0
		}
		TANK
		{
			name = Hydrazine
			amount = 400.0
			maxAmount = 400.0
		}
		
	}
	
	!MODULE[ModuleRCSFX]{}
	
	MODULE
	{
		name = ModuleRCSFX
		thrusterTransformName = RCSthruster
		thrusterPower = 0.22

		PROPELLANT
		{
			name = Hydrazine
			ratio = 1.0
			DrawGauge = True
		}
		atmosphereCurve
		{
			key = 0 240
			key = 1 82.08
		}
	}
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 12.0
		@maxThrust = 30.0
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = Hydrazine
			@ratio = 1.0
			@DrawGauge = True
		}
		!PROPELLANT[Oxidizer]{}

		@atmosphereCurve
		{
			@key,0 = 0 240
			@key,1 = 1 82.08
		}
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}

}

