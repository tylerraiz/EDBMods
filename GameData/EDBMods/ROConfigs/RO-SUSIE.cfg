@PART[EDB-SUSIEEngine]:FOR[RealismOverhaul]
{
	%RSSROConfig = True
	

	@mass = 0.3
	!MODEL{}
	MODEL
	{
		model = EDBMods/Parts/Ariane6/SUSIEEngine
		scale = 0.7, 0.7, 0.7
	}
	@scale = 0.7
	@rescaleFactor = 1.0
	
	
	@MODULE[ModuleEngines*]
	{
		@minThrust = 100.0
		@maxThrust = 250.0
		@heatProduction = 100
		@PROPELLANT[LiquidFuel]
		{
			@name = MMH
			@ratio = 0.499
			@DrawGauge = True
		}
		@PROPELLANT[Oxidizer]
		{
			@name = MON3
			@ratio = 0.501
		
		}
		@atmosphereCurve
		{
			@key,0 = 0 305.0
			@key,1 = 1 240.0
		}
		%ullage = False
		%pressureFed = True
		%ignitions = 40
		!IGNITOR_RESOURCE,* {}
		IGNITOR_RESOURCE
		{
			name = ElectricCharge
			amount = 1.0
		}
	}
	
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		modded = false
		configuration = SUSIEEngine
		CONFIG
		{
			name = SUSIEEngine
			minThrust = 100.0
			maxThrust = 250.0
			heatProduction = 160
			PROPELLANT
			{
				name = MMH
				ratio = 0.499
				DrawGauge = True
			}
			PROPELLANT
			{
				name = MON3
				ratio = 0.501
			}
			atmosphereCurve
			{
				key = 0 305.0
				key = 1 240.0
			}
		}
		
	}
	
	@MODULE[ModuleGimbal]
	{
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

}

@PART[EDB-SUSIEEngine]:FOR[RealPlume]:NEEDS[SmokeScreen]
{
    @MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesRF
		%powerEffectName = Hypergolic_UpperOrange
		!fxOffset = DELETE

	}
	@MODULE[ModuleEngineConfigs]
	{
		%type = ModuleEnginesRF
	}
    PLUME
    {
        name = Hypergolic_UpperOrange
        transformName = thrustTransform
        localRotation = 0,0,0
        localPosition = 0,0,0
        fixedScale = 0.8
        energy = 1
        speed = 1
    }
}